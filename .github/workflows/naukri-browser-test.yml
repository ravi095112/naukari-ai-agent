name: Naukri Agent - Browser Test

on:
  workflow_dispatch:

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Create storage state
        env:
          NAUKRI_STORAGE_STATE: ${{ secrets.NAUKRI_STORAGE_STATE }}
        run: |
          set -eu
          mkdir -p data

          if [ -z "${NAUKRI_STORAGE_STATE:-}" ]; then
            echo "NAUKRI_STORAGE_STATE secret is empty or missing"
            exit 1
          fi

          printf '%s' "$NAUKRI_STORAGE_STATE" > data/naukri-storage-state-min.json
          python -m json.tool data/naukri-storage-state-min.json > /dev/null
          echo "Storage state is valid JSON"

      - name: Test Naukri connectivity
        run: |
          curl -4 \
            --http1.1 \
            --location \
            --compressed \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --user-agent "Mozilla/5.0" \
            --output /dev/null \
            --dump-header - \
            --write-out '\nHTTP=%{http_code} TOTAL=%{time_total}s\n' \
            https://www.naukri.com/

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run Naukri browser test
        env:
          DISPLAY: :99
        run: |
          Xvfb :99 -screen 0 1440x900x24 -ac +extension RANDR &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" || true' EXIT

          sleep 2
          python app/test_storage_state.py
